<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Говорун AI — сверка стиля</title>
<style>
:root{--bg:#0A0E27;--panel:#1F1F21;--purple:#6B2FA0;--gold:#D4AF37;--white:#FFF;--muted:#B0B0B0}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 70% 0%,#2a1848 0%,transparent 50%),var(--bg);color:var(--white);font-family:Inter,system-ui,sans-serif;padding:24px}
.card{width:min(380px,100%);background:linear-gradient(160deg,#1a1a2e,var(--panel));border:1px solid #3a3550;border-radius:20px;padding:28px 22px;text-align:center;box-shadow:0 20px 50px #0006}
.logo{width:96px;height:96px;object-fit:contain;margin:0 auto 14px;display:block}
.brand{font-size:18px;font-weight:800;letter-spacing:.04em}
.brand span{color:var(--gold)}
.tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:8px 0 12px}
.line{height:1px;background:linear-gradient(90deg,transparent,var(--purple),var(--gold),transparent);margin:10px 0 12px}
.product{font-size:13px;color:#e8e6f0}
.note{font-size:10px;color:var(--muted);margin-top:12px;line-height:1.4}
.pill{display:inline-block;margin-top:10px;font-size:10px;color:#e5d5f5;border:1px solid #76569a;border-radius:999px;padding:4px 10px}
</style>
</head>
<body>
<article class="card">
<img class="logo" alt="Говорун AI" src="https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F02a142e8-f304-4dfe-b767-d7b9101a8497/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAG0UHxE1QakBKCaTpW88dZQJFfM9cQpay9NususIsJEq&exp=1793990037&osig=AAAAAAAAAAAAAAAAAAAAADeOoJ40EXwNBPGE8IevBKFxGKGlBa-oanPwdwgFjOUA&signer=media-rpc&token=AAIAAU0AJDAyYTE0MmU4LWYzMDQtNGRmZS1iNzY3LWQ3YjkxMDFhODQ5NwAAAAABobIjjgiSe93RKTt0-Y5vw_XEikjf-1e8AFjZk_AKGAn0MfcSGw&x-canva-quality=thumbnail">
<div class="brand">ГОВОРУН <span>AI</span></div>
<div class="tag">Общается · Анализирует · Обучает</div>
<div class="line"></div>
<p class="product">AI-тренажёр для операторов БФЛ</p>
<p class="note">Мини-флаер для сверки фирменного стиля<br>Логотип Canva · MAHVKIkWkdY<br>URL лого временный (Canva); для продакшена вшьём файл в репо</p>
<div class="pill">брендбук · тест</div>
</article>
</body>
</html>
