<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Говорун AI — сверка стиля</title>
<style>
:root{--bg:#0A0E27;--panel:#1F1F21;--purple:#6B2FA0;--gold:#D4AF37;--white:#FFF;--muted:#B0B0B0}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 70% 0%,#2a1848 0%,transparent 50%),var(--bg);color:var(--white);font-family:Inter,system-ui,sans-serif;padding:24px}
.card{width:min(400px,100%);background:linear-gradient(160deg,#1a1a2e,var(--panel));border:1px solid #3a3550;border-radius:20px;padding:32px 24px;text-align:center;box-shadow:0 20px 50px #0006}
.logo{width:112px;height:auto;object-fit:contain;margin:0 auto 16px;display:block}
.brand{font-size:20px;font-weight:800;letter-spacing:.04em}
.brand span{color:var(--gold)}
.tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:8px 0 14px}
.line{height:1px;background:linear-gradient(90deg,transparent,var(--purple),var(--gold),transparent);margin:12px 0 14px}
.product{font-size:14px;color:#e8e6f0}
.note{font-size:11px;color:var(--muted);margin-top:14px;line-height:1.4}
.pill{display:inline-block;margin-top:12px;font-size:11px;color:#e5d5f5;border:1px solid #76569a;border-radius:999px;padding:5px 11px}
</style>
</head>
<body>
<article class="card">
<img class="logo" alt="Говорун AI" id="logo" src="">
<div class="brand">ГОВОРУН <span>AI</span></div>
<div class="tag">Общается · Анализирует · Обучает</div>
<div class="line"></div>
<p class="product">AI-тренажёр для операторов БФЛ</p>
<p class="note">Мини-флаер для сверки фирменного стиля</p>
<div class="pill">брендбук · тест</div>
</article>
<script>
(async()=>{
  const n=7; const parts=[];
  for(let i=0;i<n;i++){
    const r=await fetch('./assets/logo.b64.'+i);
    if(!r.ok){console.error('logo part',i,r.status);return;}
    parts.push(await r.text());
  }
  document.getElementById('logo').src='data:image/png;base64,'+parts.join('').replace(/\s/g,'');
})();
</script>
</body>
</html>
